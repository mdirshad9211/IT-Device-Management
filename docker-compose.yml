version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local_pw
      POSTGRES_DB: inventory_dev
    ports:
      - "5432:5432"
    volumes:
      - inventory_pg_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    container_name: inventory-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local_pw
      POSTGRES_DB: inventory_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  inventory_pg_data:
